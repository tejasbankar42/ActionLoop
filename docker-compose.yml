services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: actionloop
      POSTGRES_USER: actionloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-actionloop-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actionloop"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://actionloop:${POSTGRES_PASSWORD:-actionloop-dev}@db:5432/actionloop
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./samples:/srv/samples
      - ./contracts/deployments:/srv/contracts/deployments:ro
      - storage:/srv/backend/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  storage:
